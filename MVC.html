<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>3D Calculus Surface & Tangent Plane Analyzer</title>

    <!-- Plotly.js -->

    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

    <!-- Math.js -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>

    <style>

        :root {

            --bg-main: #0f172a;       /* Slate Dark / Deep Navy */

            --card-bg: #1e293b;       /* Dark Blue Gray */

            --accent: #f59e0b;        /* Solid Amber Gold */

            --accent-hover: #d97706;

            --text-main: #f8fafc;     /* Crisp White */

            --text-muted: #94a3b8;    /* Muted Gray */

            --border-color: #334155;

        }



        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

        }



        body {

            background-color: var(--bg-main);

            color: var(--text-main);

            min-height: 100vh;

            padding: 30px 20px;

        }



        .app-container {

            max-width: 1200px;

            margin: 0 auto;

        }



        header {

            margin-bottom: 25px;

            border-bottom: 2px solid var(--border-color);

            padding-bottom: 15px;

        }



        header h1 {

            font-size: 1.8rem;

            color: var(--text-main);

            font-weight: 700;

            letter-spacing: 0.5px;

        }



        header p {

            color: var(--text-muted);

            font-size: 0.95rem;

            margin-top: 5px;

        }



        .main-layout {

            display: grid;

            grid-template-columns: 320px 1fr;

            gap: 25px;

        }



        @media (max-width: 900px) {

            .main-layout {

                grid-template-columns: 1fr;

            }

        }



        /* Control Panel Card */

        .control-panel {

            background-color: var(--card-bg);

            border: 1px solid var(--border-color);

            border-radius: 12px;

            padding: 24px;

            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);

        }



        .control-group {

            margin-bottom: 20px;

        }



        .control-group label {

            display: block;

            font-size: 0.85rem;

            font-weight: 600;

            text-transform: uppercase;

            letter-spacing: 0.5px;

            color: var(--text-muted);

            margin-bottom: 8px;

        }



        .control-group input {

            width: 100%;

            padding: 12px 14px;

            background-color: #0f172a;

            border: 1px solid var(--border-color);

            border-radius: 8px;

            color: var(--text-main);

            font-size: 1rem;

            outline: none;

            transition: border-color 0.2s;

        }



        .control-group input:focus {

            border-color: var(--accent);

        }



        .btn-primary {

            width: 100%;

            padding: 12px;

            background-color: var(--accent);

            color: #0f172a;

            border: none;

            border-radius: 8px;

            font-size: 1rem;

            font-weight: 700;

            cursor: pointer;

            transition: background-color 0.2s, transform 0.1s;

        }



        .btn-primary:hover {

            background-color: var(--accent-hover);

            color: #ffffff;

        }



        .btn-primary:active {

            transform: scale(0.98);

        }



        /* Info / Formula Box */

        .info-box {

            margin-top: 25px;

            background-color: #0f172a;

            border-left: 4px solid var(--accent);

            padding: 15px;

            border-radius: 0 8px 8px 0;

        }



        .info-box h3 {

            font-size: 0.9rem;

            color: var(--text-muted);

            margin-bottom: 5px;

        }



        .info-box p {

            font-size: 0.95rem;

            font-family: monospace;

            color: var(--accent);

        }



        /* Graph Display Box */

        .graph-panel {

            background-color: var(--card-bg);

            border: 1px solid var(--border-color);

            border-radius: 12px;

            padding: 20px;

            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);

            display: flex;

            flex-direction: column;

            justify-content: center;

        }



        #plot {

            width: 100%;

            height: 550px;

        }

    </style>

</head>

<body>



<div class="app-container">

    <header>

        <h1>Multivariable Calculus 3D Visualizer</h1>

        <p>Interactive Tangent Plane & Surface Plotter</p>

    </header>



    <div class="main-layout">

        <!-- Sidebar Controls -->

        <div class="control-panel">

            <div class="control-group">

                <label for="fn">Function z = f(x, y)</label>

                <input type="text" id="fn" value="x^2 + y^2">

            </div>



            <div class="control-group">

                <label for="x0">Point X₀ Coordinate</label>

                <input type="number" id="x0" value="1" step="0.5">

            </div>



            <div class="control-group">

                <label for="y0">Point Y₀ Coordinate</label>

                <input type="number" id="y0" value="1" step="0.5">

            </div>



            <button class="btn-primary" onclick="updatePlot()">Render Graph</button>



            <div class="info-box">

                <h3>Calculated Z₀ Value</h3>

                <p id="z0-display">Z₀ = --</p>

            </div>

        </div>



        <!-- Plot Area -->

        <div class="graph-panel">

            <div id="plot"></div>

        </div>

    </div>

</div>



<script>

function updatePlot() {

    const expr = document.getElementById('fn').value;

    const x0 = parseFloat(document.getElementById('x0').value);

    const y0 = parseFloat(document.getElementById('y0').value);



    try {

        const node = math.parse(expr);

        const code = node.compile();

       

        // Evaluate z0 at the given point

        const z0 = code.evaluate({x: x0, y: y0});

        document.getElementById('z0-display').innerText = `Z₀ = ${z0.toFixed(4)}`;



        // Generate grid data for 3D surface

        const size = 25;

        const xValues = [], yValues = [];

        for (let i = -2.5; i <= 2.5; i += 5/size) {

            xValues.push(i);

            yValues.push(i);

        }



        let zMatrix = [];

        for (let i = 0; i < yValues.length; i++) {

            let row = [];

            for (let j = 0; j < xValues.length; j++) {

                let x = xValues[j];

                let y = yValues[i];

                try {

                    row.push(code.evaluate({x: x, y: y}));

                } catch (e) {

                    row.push(null);

                }

            }

            zMatrix.push(row);

        }



        // Surface Trace with sleek solid-feeling color scale

        const surfaceTrace = {

            type: 'surface',

            x: xValues,

            y: yValues,

            z: zMatrix,

            colorscale: 'YlGnBu',

            opacity: 0.85,

            name: 'Surface f(x,y)'

        };



        // Point Marker Trace at (x0, y0, z0)

        const pointTrace = {

            type: 'scatter3d',

            mode: 'markers',

            x: [x0],

            y: [y0],

            z: [z0],

            marker: { size: 8, color: '#f59e0b' },

            name: 'Point P₀'

        };



        // Layout matching the solid dark theme

        const layout = {

            paper_bgcolor: '#1e293b',

            plot_bgcolor: '#1e293b',

            font: { color: '#f8fafc' },

            title: {

                text: `Surface: z = ${expr}`,

                font: { size: 16 }

            },

            scene: {

                xaxis: { title: 'X Axis', gridcolor: '#334155', zerolinecolor: '#475569' },

                yaxis: { title: 'Y Axis', gridcolor: '#334155', zerolinecolor: '#475569' },

                zaxis: { title: 'Z Axis', gridcolor: '#334155', zerolinecolor: '#475569' },

                bgcolor: '#0f172a'

            },

            margin: { l: 0, r: 0, b: 0, t: 40 },

            legend: { x: 0, y: 1 }

        };



        Plotly.newPlot('plot', [surfaceTrace, pointTrace], layout, {responsive: true});



    } catch (err) {

        alert("Syntax Error in Function Expression! Please check your input.");

    }

}



// Initial render on page load

updatePlot();

</script>



</body>

</html>
